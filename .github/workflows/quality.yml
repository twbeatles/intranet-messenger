name: quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # PySide6 wheels link against system GL/EGL libs missing from the
      # minimal ubuntu image (ImportError: libEGL.so.1 broke
      # tests/test_gui_import_smoke.py on 2026-10-22). Install just the
      # runtime libs needed for QtCore/QtGui/QtWidgets *imports*.
      - name: Install Qt runtime libs (PySide6 needs system EGL/GL)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      # unit runs everything except the network/browser E2E selection, which
      # needs E2E-only deps (requests/python-socketio/playwright + Chromium)
      # installed in the network-e2e job. -m "not browser" future-proofs this
      # against new browser-marked modules; the explicit --ignore keeps this
      # file out even if its marker is ever dropped.
      - run: python -m pytest tests -q -p no:cacheprovider -m "not browser" --ignore=tests/test_room_auth_boundaries.py --ignore=tests/test_recovery_integrity.py --ignore=tests/test_browser_e2e.py
        env:
          # Headless runner: never try to open a real display even if a
          # future test instantiates QApplication.
          QT_QPA_PLATFORM: offscreen

  network-e2e:
    # P0: permission boundaries + backup/restore integrity on isolated
    # loopback resources only (no production DB/uploads, no external IdP/AV).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/test_room_auth_boundaries.py tests/test_recovery_integrity.py tests/test_project_audit_remediation.py tests/test_restore_local.py tests/test_user_deletion.py tests/test_upload_tokens.py tests/test_message_interleaving.py -q -p no:cacheprovider
      - run: python -m pip install playwright requests python-socketio
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/test_browser_e2e.py -q -p no:cacheprovider
        env:
          RUN_LIVE_E2E: "1"

  js:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run check:js
